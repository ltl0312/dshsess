name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: node --test

      - name: 端到端自检（造三帧会话文件，走 list/show/advice）
        shell: bash
        run: |
          node -e '
            const { zstdCompressSync } = require("node:zlib");
            const fs = require("node:fs");
            const path = require("node:path");
            const events = [
              { type: "session", version: 4, id: "session-ci", createdAt: 1792656470000, cwd: "D:\\demo" },
              { type: "turn/start", seq: 1, time: 1792656471000, data: { turn: 1 } },
              { type: "tool/call", seq: 2, time: 1792656471100, data: { turn: 1, step: 1, callId: "c1", name: "edit", arguments: "{}" } },
              { type: "tool/result", seq: 3, time: 1792656471200, data: { turn: 1, step: 1, message: { role: "tool" }, error: { name: "FsError", code: "FS_EDIT_NOT_FOUND" } } },
              { type: "turn/end", seq: 4, time: 1792656473000, data: { turn: 1, reason: { kind: "error" } } },
            ];
            const dir = path.join(".ci-home", "sessions", "--D-demo--", "session-ci");
            fs.mkdirSync(dir, { recursive: true });
            const frames = events.map((e) => zstdCompressSync(Buffer.from(JSON.stringify(e) + "\n")));
            fs.writeFileSync(path.join(dir, "session.v4.jsonl.zstd"), Buffer.concat(frames));
          '
          export DSH_HOME="$PWD/.ci-home"
          node src/cli.js list
          node src/cli.js show ci --limit 5
          node src/cli.js advice ci

      - name: 打包自检（bin 与 files 是否真的进包）
        shell: bash
        run: |
          npm pack --dry-run 2>&1 | tee pack.log
          node -e '
            const t = require("node:fs").readFileSync("pack.log", "utf8");
            const need = ["src/index.js", "src/cli.js", "README.md", "LICENSE"];
            const missing = need.filter((f) => !t.includes(f));
            if (missing.length) {
              console.error("打包缺文件:", missing.join(", "));
              process.exit(1);
            }
            console.log("打包内容完整:", need.length, "个必需文件");
          '
